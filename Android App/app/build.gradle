plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acme.shop'
    compileSdk 35

    defaultConfig {
        applicationId "com.acme.shop"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // WebView remote debugging is enabled from MainActivity for testing.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            res.srcDirs = ['src/main/res']
        }
    }
}
